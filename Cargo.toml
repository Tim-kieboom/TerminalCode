[package]
name = "terminal_code"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
portable-pty = "0.9.0"
ratatui = "0.30.2"
ropey = "1.6.1"
tui-term = "0.3.4"
vt100 = "0.16.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
vecmap = { version = "0.1.0", path = "lib/vecmap" }
time = { version = "0.3.55", features = ["formatting", "local-offset", "macros"] }