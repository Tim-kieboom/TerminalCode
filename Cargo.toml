[package]
name = "terminal_code"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.34"
ratatui = "0.30.2"
ron = "0.12.2"
ropey = "1.6.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "1.1.6"
