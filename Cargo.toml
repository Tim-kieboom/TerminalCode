[workspace]
members = [".", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.10.2"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Tim Kieboom"]

[workspace.dependencies]
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
thiserror = "2.0.21"
unicode-segmentation = "1.13.3"
proptest = "1.11.0"
tempfile = "3.27.0"
trcode-ids = { path = "crates/ids" }
trcode-buffer = { path = "crates/buffer" }
trcode-files = { path = "crates/files" }
trcode-pty = { path = "crates/pty" }
trcode-lsp = { path = "crates/lsp" }
trcode-syntax = { path = "crates/syntax" }
trcode-clipboard = { path = "crates/clipboard" }
trcode-jumplist = { path = "crates/jumplist" }
trcode-launch = { path = "crates/launch" }
trcode-dap = { path = "crates/dap" }
trcode-breakpoints = { path = "crates/breakpoints" }
trcode-ui = { path = "crates/ui" }
trcode-plugin-api = { path = "crates/plugin-api" }
ron = "0.12.2"
unicode-width = "0.2.2"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
base64 = "0.23.1"
ratatui = "0.30.2"
tree-sitter = "0.27.1"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-json = "0.24.8"
tree-sitter-md = "0.5.3"
tree-sitter-nix = "0.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.6"
crossterm = "0.29.0"
portable-pty = "0.9.0"
vt100 = "0.16.2"
notify-debouncer-mini = "0.7.0"
renamore = "0.3.2"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time"] }
trash = "5.2.9"

[package]
name = "terminal_code"
description = "A lightweight, keyboard-driven IDE for the terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "trcode"
path = "src/main.rs"

[dependencies]
ron.workspace = true
toml.workspace = true
dirs = "7.0.0"
trash.workspace = true
regex = "1.13.1"
base64.workspace = true
ignore = "0.4.33"
futures = "0.3.34"
ratatui.workspace = true
renamore.workspace = true
thiserror.workspace = true
grep-regex = "0.1.14"
grep-matcher = "0.1.9"
unicode-width.workspace = true
grep-searcher = "0.1.17"
terminal-colorsaurus = "1.0.3"
unicode-segmentation.workspace = true
notify-debouncer-mini.workspace = true
serde.workspace = true
crossterm = { workspace = true, features = ["event-stream"] }
tree-sitter.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-toml-ng.workspace = true
tree-sitter-json.workspace = true
tree-sitter-md.workspace = true
tree-sitter-nix.workspace = true
portable-pty.workspace = true
vt100.workspace = true
ropey.workspace = true
trcode-ids.workspace = true
trcode-buffer.workspace = true
trcode-files.workspace = true
trcode-pty.workspace = true
trcode-lsp.workspace = true
trcode-syntax.workspace = true
trcode-clipboard.workspace = true
trcode-jumplist.workspace = true
trcode-launch.workspace = true
trcode-breakpoints.workspace = true
trcode-dap.workspace = true
trcode-ui.workspace = true
trcode-plugin-api.workspace = true
tokio.workspace = true
arboard.workspace = true
serde_json.workspace = true
wasmi = { version = "2.0.0", default-features = false, features = ["std", "stable", "validate", "auto-dispatch"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.11.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
trcode-lsp = { workspace = true, features = ["test-support"] }
trcode-clipboard = { workspace = true, features = ["test-support"] }
trcode-dap = { workspace = true, features = ["test-support"] }
proptest.workspace = true
tempfile.workspace = true
wat = "1.262.0"
