[workspace]
members = [".", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.6.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Tim Kieboom"]

[workspace.dependencies]
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
thiserror = "2.0.21"
unicode-segmentation = "1.13.3"
proptest = "1.11.0"
tempfile = "3.27.0"
trcode-ids = { path = "crates/ids" }
trcode-buffer = { path = "crates/buffer" }
trcode-files = { path = "crates/files" }
trcode-pty = { path = "crates/pty" }
trcode-lsp = { path = "crates/lsp" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.6"
crossterm = "0.29.0"
portable-pty = "0.9.0"
vt100 = "0.16.2"
notify-debouncer-mini = "0.7.0"
renamore = "0.3.2"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time"] }
trash = "5.2.9"

[package]
name = "terminal_code"
description = "A lightweight, keyboard-driven IDE for the terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "trcode"
path = "src/main.rs"

[dependencies]
ron = "0.12.2"
toml.workspace = true
dirs = "7.0.0"
trash.workspace = true
regex = "1.13.1"
base64 = "0.23.1"
ignore = "0.4.33"
futures = "0.3.34"
ratatui = "0.30.2"
renamore.workspace = true
thiserror.workspace = true
grep-regex = "0.1.14"
grep-matcher = "0.1.9"
unicode-width = "0.2.2"
grep-searcher = "0.1.17"
terminal-colorsaurus = "1.0.3"
unicode-segmentation.workspace = true
notify-debouncer-mini.workspace = true
serde.workspace = true
crossterm = { workspace = true, features = ["event-stream"] }
tree-sitter = "0.27.1"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-json = "0.24.8"
tree-sitter-md = "0.5.3"
tree-sitter-nix = "0.3.0"
portable-pty.workspace = true
vt100.workspace = true
ropey.workspace = true
trcode-ids.workspace = true
trcode-buffer.workspace = true
trcode-files.workspace = true
trcode-pty.workspace = true
trcode-lsp.workspace = true
tokio.workspace = true
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
trcode-lsp = { workspace = true, features = ["test-support"] }
proptest.workspace = true
tempfile.workspace = true
