name: CI

on:
  push:
    branches: [main, redo]
    # macOS runs here, on a release (see the matrix).
    tags: ['v*']
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # No debug info: it makes the build, the link (a debug-info file per test binary on
  # Windows) and the cache smaller. A failing assertion still names its file and line.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  check:
    name: ${{ matrix.os }} (${{ matrix.part }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # macOS is best-effort: a failure there does not fail the workflow.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is the slowest runner and best-effort, so a push to a branch skips it; a
        # pull request and a release tag run it.
        os: ${{ fromJSON(github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
        # Windows is the slowest and runs its tests in two halves (see the Test step); the
        # other systems run them all in part 1.
        part: [1, 2]
        exclude:
          - { os: ubuntu-latest, part: 2 }
          - { os: macos-latest, part: 2 }
    steps:
      - uses: actions/checkout@v4
      # The runners come with the stable toolchain, clippy and rustfmt.
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # Formatting does not depend on the system.
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      # Clippy runs on Ubuntu only: it lints the Unix code. Code behind `cfg(windows)` is
      # compiled and tested on Windows but not linted.
      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets
      # nextest kills a test that hangs (see .config/nextest.toml) and lists every
      # failure at the end, so one stuck terminal test cannot hold up the run.
      # Windows runs half of them in each of two jobs, each of which builds all of them:
      # the build is the same and the running is halved.
      - name: Test
        timeout-minutes: 10
        run: cargo nextest run --workspace --no-fail-fast --partition count:${{ matrix.os == 'windows-latest' && 2 || 1 }}/${{ matrix.part }}
      # The Git pane is a plugin in a repository of its own: build its module and run
      # the tests that load it into the editor (they are ignored unless asked for).
      - name: Git plugin (WebAssembly)
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup target add wasm32-unknown-unknown
          git clone --depth 1 https://github.com/Tim-kieboom/trcode-plugin-git ../trcode-plugin-git
          (cd ../trcode-plugin-git && cargo build --target wasm32-unknown-unknown --release)
          TRCODE_PLUGIN_GIT_DIR="$PWD/../trcode-plugin-git" cargo test -p terminal_code real_plugin -- --ignored
