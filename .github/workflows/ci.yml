name: CI

on:
  push:
    branches: [main, redo]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # macOS is best-effort: a failure there does not fail the workflow.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets
      # nextest kills a test that hangs (see .config/nextest.toml) and lists every
      # failure at the end, so one stuck terminal test cannot hold up the run.
      - name: Test
        timeout-minutes: 10
        run: cargo nextest run --no-fail-fast
