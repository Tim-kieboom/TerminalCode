name: CI

on:
  push:
    branches: [main, redo]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # A hung test (the terminal tests can hang on a platform) must not hold the
    # runner for the default six hours.
    timeout-minutes: 30
    # macOS is best-effort: a failure there does not fail the workflow.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets
      - name: Test
        timeout-minutes: 15
        run: cargo test
      # The terminal tests one at a time with their output, so a failing or
      # hanging one on Windows (ConPTY) says where. Runs after a failed Test.
      - name: Terminal tests, one at a time
        if: ${{ failure() && matrix.os == 'windows-latest' }}
        timeout-minutes: 10
        continue-on-error: true
        run: "cargo test pty:: -- --test-threads=1 --nocapture"
