# A test that hangs (the terminal tests can, on a platform whose pseudo-terminal
# behaves differently) is killed after a minute and reported as a failure, instead
# of holding the whole run until the job times out.
[profile.default]
slow-timeout = { period = "20s", terminate-after = 3 }
fail-fast = false

# These measure how long keys and frames take while a shell floods the terminal,
# which a busy shared runner can stretch. A test that passes on a retry is
# reported as flaky, not hidden.
[[profile.default.overrides]]
filter = 'test(flood_tests)'
retries = 2
