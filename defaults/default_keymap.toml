# Default keymap. Each [[binding]] maps a key chord to an action.
# keys:    modifiers (ctrl, alt, shift, super) joined with "+", then a key: a single
#          character, or a name such as enter, esc, tab, space, up, f5.
#          Separate chords with spaces for a sequence: "ctrl+k ctrl+s".
# context: "global" (default), "editor", "explorer", "errors", "debug" or "plugin" (while a plugin's pane has the keyboard;
#          the keys a plugin declares work there too, yours win). Editor bindings win over global ones.
# action:  see below. Leave it out in your own keymap to remove a default binding.
# Actions: "quit", "command_palette", "find_file", "find_in_project", "next_search_result", "previous_search_result", "next_diagnostic", "previous_diagnostic", "show_diagnostics", "show_hover", "jump_back", "jump_forward", "go_to_definition", "rename_symbol", "code_actions", "format_document", "format_selection", "find_in_file", "find_next", "find_previous", "replace_in_file", "go_to_line", "save", "undo", "redo", "insert_newline", "delete_backward",
#   "delete_word_backward", "delete_word_forward", "select_all", "move_line_up", "move_line_down", "add_cursor_above", "add_cursor_below", "collapse_cursors", "copy", "cut", "paste",
#   "indent", "outdent", "indent_line", "outdent_line", "toggle_comment", "toggle_mouse", "new_file", "close_tab", "close_other_tabs", "close_tabs_to_left", "close_tabs_to_right", "toggle_pin_tab", "close_all_tabs", "reopen_closed_tab", "save_all", "run", "choose_run", "toggle_breakpoint", "clear_breakpoints", "debug", "debug_continue", "debug_step_over", "debug_step_into", "debug_step_out", "debug_stop", "debug_restart", "next_tab", "previous_tab",
#   "split_right", "split_down", "focus_next_pane", { focus_pane = "left"|"right"|"up"|"down" },
#   "delete_forward", { insert_text = "..." }, { move = motion },
#   { select = motion }, "focus_explorer", "delete_selected", "create_file", "create_folder", "rename", "move_entry", "context_menu", "toggle_explorer", "toggle_side_pane", "reset_pane_sizes", "side_pane_wider", "side_pane_narrower", "pane_grow", "pane_shrink", "toggle_status_bar", "toggle_terminal", "open_file", "open_folder", "open_menu", "toggle_menu_bar", "next_bar_view", "previous_bar_view", "show_errors", { errors = "up"|"down"|"page_up"|"page_down"|"first"|"last"|"open"|"leave" }, "show_debug", { debug_pane = "up"|"down"|"page_up"|"page_down"|"first"|"last"|"open"|"expand"|"collapse"|"switch"|"leave" }, "terminal_new_tab", "terminal_copy", "terminal_next_tab", "terminal_previous_tab", "terminal_close_tab", "focus_editor", { focus_plugin_view = "plugin-name" }, { open_plugin_popup = "plugin-name" } (also written { open_plugin = "plugin-name" }: opens a plugin wherever it is placed, and gives it the keyboard), { plugin = "plugin-name:action-id" },
#   { toggle_plugin_view = "view.id" }, { explorer = command }, { plugin = "name" }.
# Explorer commands: up, down, page_up, page_down, first, last, expand, collapse, open, refresh,
#   toggle_hidden.
# Motions: left, right, up, down, page_up, page_down, word_left, word_right, line_start, line_end, paragraph_up,
#   paragraph_down, document_start, document_end.
# Plain printable keys with no binding are typed into the editor.

# Application
[[binding]]
keys = "ctrl+q"
action = "quit"

[[binding]]
keys = "ctrl+s"
context = "editor"
action = "save"

# History
[[binding]]
keys = "ctrl+z"
context = "editor"
action = "undo"

[[binding]]
keys = "ctrl+y"
context = "editor"
action = "redo"

[[binding]]
keys = "ctrl+shift+z"
context = "editor"
action = "redo"

# Editing
[[binding]]
keys = "enter"
context = "editor"
action = "insert_newline"

[[binding]]
keys = "tab"
context = "editor"
action = "indent"

[[binding]]
keys = "shift+tab"
context = "editor"
action = "outdent"

[[binding]]
keys = "ctrl+]"
context = "editor"
action = "indent_line"

[[binding]]
keys = "ctrl+/"
context = "editor"
action = "toggle_comment"

[[binding]]
keys = "ctrl+["
context = "editor"
action = "outdent_line"

[[binding]]
keys = "backspace"
context = "editor"
action = "delete_backward"

[[binding]]
keys = "delete"
context = "editor"
action = "delete_forward"

# Movement
[[binding]]
keys = "left"
context = "editor"
action = { move = "left" }

[[binding]]
keys = "right"
context = "editor"
action = { move = "right" }

[[binding]]
keys = "up"
context = "editor"
action = { move = "up" }

[[binding]]
keys = "down"
context = "editor"
action = { move = "down" }

[[binding]]
keys = "home"
context = "editor"
action = { move = "line_start" }

[[binding]]
keys = "end"
context = "editor"
action = { move = "line_end" }

[[binding]]
keys = "ctrl+home"
context = "editor"
action = { move = "document_start" }

[[binding]]
keys = "ctrl+end"
context = "editor"
action = { move = "document_end" }

# Selection
[[binding]]
keys = "shift+left"
context = "editor"
action = { select = "left" }

[[binding]]
keys = "shift+right"
context = "editor"
action = { select = "right" }

[[binding]]
keys = "shift+up"
context = "editor"
action = { select = "up" }

[[binding]]
keys = "shift+down"
context = "editor"
action = { select = "down" }

[[binding]]
keys = "shift+home"
context = "editor"
action = { select = "line_start" }

[[binding]]
keys = "shift+end"
context = "editor"
action = { select = "line_end" }

[[binding]]
keys = "ctrl+shift+home"
context = "editor"
action = { select = "document_start" }

[[binding]]
keys = "ctrl+shift+end"
context = "editor"
action = { select = "document_end" }

# Words (alt+arrows and alt+backspace work where terminals cannot report ctrl+arrows)
[[binding]]
keys = "ctrl+left"
context = "editor"
action = { move = "word_left" }

[[binding]]
keys = "ctrl+right"
context = "editor"
action = { move = "word_right" }

[[binding]]
keys = "alt+left"
context = "editor"
action = { move = "word_left" }

[[binding]]
keys = "alt+right"
context = "editor"
action = { move = "word_right" }

[[binding]]
keys = "ctrl+shift+left"
context = "editor"
action = { select = "word_left" }

[[binding]]
keys = "ctrl+shift+right"
context = "editor"
action = { select = "word_right" }

[[binding]]
keys = "alt+shift+left"
context = "editor"
action = { select = "word_left" }

[[binding]]
keys = "alt+shift+right"
context = "editor"
action = { select = "word_right" }

# Paragraphs: the next or previous blank line
[[binding]]
keys = "ctrl+up"
context = "editor"
action = { move = "paragraph_up" }

[[binding]]
keys = "ctrl+down"
context = "editor"
action = { move = "paragraph_down" }

[[binding]]
keys = "ctrl+shift+up"
context = "editor"
action = { select = "paragraph_up" }

[[binding]]
keys = "ctrl+shift+down"
context = "editor"
action = { select = "paragraph_down" }

# Move line
[[binding]]
keys = "alt+up"
context = "editor"
action = "move_line_up"

[[binding]]
keys = "alt+down"
context = "editor"
action = "move_line_down"

# More cursors: one on the line above or below; esc goes back to one
[[binding]]
keys = "ctrl+alt+up"
context = "editor"
action = "add_cursor_above"

[[binding]]
keys = "ctrl+alt+down"
context = "editor"
action = "add_cursor_below"

[[binding]]
keys = "esc"
context = "editor"
action = "collapse_cursors"

[[binding]]
keys = "ctrl+backspace"
context = "editor"
action = "delete_word_backward"

[[binding]]
keys = "alt+backspace"
context = "editor"
action = "delete_word_backward"

[[binding]]
keys = "ctrl+delete"
context = "editor"
action = "delete_word_forward"

[[binding]]
keys = "alt+delete"
context = "editor"
action = "delete_word_forward"

[[binding]]
keys = "ctrl+a"
context = "editor"
action = "select_all"

# Clipboard. With nothing selected, copy and cut take the whole line.
# (The terminal's own paste, e.g. ctrl+shift+v, arrives as bracketed paste and needs no binding.)
[[binding]]
keys = "ctrl+c"
context = "editor"
action = "copy"

[[binding]]
keys = "ctrl+x"
context = "editor"
action = "cut"

[[binding]]
keys = "ctrl+v"
context = "editor"
action = "paste"

[[binding]]
keys = "ctrl+insert"
context = "editor"
action = "copy"

[[binding]]
keys = "shift+delete"
context = "editor"
action = "cut"

[[binding]]
keys = "shift+insert"
context = "editor"
action = "paste"

# Pages
[[binding]]
keys = "pageup"
context = "editor"
action = { move = "page_up" }

[[binding]]
keys = "pagedown"
context = "editor"
action = { move = "page_down" }

[[binding]]
keys = "shift+pageup"
context = "editor"
action = { select = "page_up" }

[[binding]]
keys = "shift+pagedown"
context = "editor"
action = { select = "page_down" }

# Mouse capture. While it is on, the editor handles clicks, drags and the wheel,
# and the terminal's own text selection needs a modifier (usually shift).
[[binding]]
keys = "alt+m"
action = "toggle_mouse"

# Tabs and panes. Every pane has its own tab strip; splitting shows the same
# document in a new pane (edits and undo are shared between views).
[[binding]]
keys = "ctrl+n"
action = "new_file"

[[binding]]
keys = "ctrl+w"
action = "close_tab"

[[binding]]
keys = "ctrl+pagedown"
action = "next_tab"

[[binding]]
keys = "ctrl+pageup"
action = "previous_tab"

[[binding]]
keys = "ctrl+tab"
action = "next_tab"

[[binding]]
keys = "ctrl+shift+tab"
action = "previous_tab"

[[binding]]
keys = "ctrl+k right"
context = "editor"
action = "split_right"

[[binding]]
keys = "ctrl+k down"
context = "editor"
action = "split_down"

[[binding]]
keys = "ctrl+k o"
context = "editor"
action = "focus_next_pane"

[[binding]]
keys = "alt+h"
action = { focus_pane = "left" }

[[binding]]
keys = "alt+j"
action = { focus_pane = "down" }

[[binding]]
keys = "alt+k"
action = { focus_pane = "up" }

[[binding]]
keys = "alt+l"
action = { focus_pane = "right" }

# Command palette. ctrl+shift+p is avoided on purpose: kitty and Windows Terminal keep it for
# themselves (kitty waits for a second key before passing anything on).
[[binding]]
keys = "f1"
action = "command_palette"

[[binding]]
keys = "alt+p"
action = "command_palette"

# Explorer. ctrl+b moves the keyboard to the explorer and, from there, back to the editor.
[[binding]]
keys = "ctrl+b"
action = "focus_explorer"

[[binding]]
keys = "esc"
context = "explorer"
action = "focus_explorer"

[[binding]]
keys = "up"
context = "explorer"
action = { explorer = "up" }

[[binding]]
keys = "down"
context = "explorer"
action = { explorer = "down" }

[[binding]]
keys = "left"
context = "explorer"
action = { explorer = "collapse" }

[[binding]]
keys = "right"
context = "explorer"
action = { explorer = "expand" }

[[binding]]
keys = "enter"
context = "explorer"
action = { explorer = "open" }

[[binding]]
keys = "pageup"
context = "explorer"
action = { explorer = "page_up" }

[[binding]]
keys = "pagedown"
context = "explorer"
action = { explorer = "page_down" }

[[binding]]
keys = "home"
context = "explorer"
action = { explorer = "first" }

[[binding]]
keys = "end"
context = "explorer"
action = { explorer = "last" }

[[binding]]
keys = "f5"
context = "explorer"
action = { explorer = "refresh" }

[[binding]]
keys = "."
context = "explorer"
action = { explorer = "toggle_hidden" }

[[binding]]
keys = "delete"
context = "explorer"
action = "delete_selected"

[[binding]]
keys = "a"
context = "explorer"
action = "create_file"

[[binding]]
keys = "shift+a"
context = "explorer"
action = "create_folder"

[[binding]]
keys = "r"
context = "explorer"
action = "rename"

[[binding]]
keys = "f2"
context = "explorer"
action = "rename"

[[binding]]
keys = "m"
context = "explorer"
action = "move_entry"

[[binding]]
keys = "shift+f10"
action = "context_menu"

# File finder
[[binding]]
keys = "ctrl+p"
action = "find_file"

# Project search (alt+f: ctrl+shift+f belongs to kitty and Windows Terminal)
[[binding]]
keys = "alt+f"
action = "find_in_project"

# Find in the open file
[[binding]]
keys = "ctrl+f"
context = "editor"
action = "find_in_file"

[[binding]]
keys = "ctrl+r"
context = "editor"
action = "replace_in_file"

# Hide and show parts of the screen. A hidden part takes no space.
[[binding]]
keys = "ctrl+k b"
action = "toggle_explorer"

[[binding]]
keys = "ctrl+k p"
action = "toggle_side_pane"

[[binding]]
keys = "ctrl+k s"
action = "toggle_status_bar"

[[binding]]
keys = "ctrl+`"
action = "toggle_terminal"

# Open a file by its path
[[binding]]
keys = "ctrl+o"
action = "open_file"

# The main menu: the icon in the top row opens it too
[[binding]]
keys = "ctrl+k m"
action = "open_menu"

# Problems: the Errors view and its keys
[[binding]]
keys = "ctrl+k d"
action = "show_errors"

[[binding]]
keys = "up"
context = "errors"
action = { errors = "up" }

[[binding]]
keys = "down"
context = "errors"
action = { errors = "down" }

[[binding]]
keys = "pageup"
context = "errors"
action = { errors = "page_up" }

[[binding]]
keys = "pagedown"
context = "errors"
action = { errors = "page_down" }

[[binding]]
keys = "home"
context = "errors"
action = { errors = "first" }

[[binding]]
keys = "end"
context = "errors"
action = { errors = "last" }

[[binding]]
keys = "enter"
context = "errors"
action = { errors = "open" }

[[binding]]
keys = "esc"
context = "errors"
action = { errors = "leave" }

# Tabs: every other tab, every tab, the tab closed last, and every modified file.
[[binding]]
keys = "ctrl+k e"
action = "close_other_tabs"

[[binding]]
keys = "ctrl+k w"
action = "close_all_tabs"

[[binding]]
keys = "ctrl+k z"
action = "reopen_closed_tab"

[[binding]]
keys = "ctrl+k a"
action = "save_all"

# Build and start the active run configuration in its terminal tab (see .trcode/launch.toml)
[[binding]]
keys = "f5"
action = "run"

# The debugger: start the active run configuration under it, and, when the program has stopped
# (F5 goes on, too), step over, into and out, and stop the session
[[binding]]
keys = "ctrl+k g"
action = "debug"

[[binding]]
keys = "ctrl+k n"
action = "debug_step_over"

[[binding]]
keys = "ctrl+k i"
action = "debug_step_into"

[[binding]]
keys = "ctrl+k u"
action = "debug_step_out"

[[binding]]
keys = "ctrl+k x"
action = "debug_stop"

# The keys of VS Code: F10 and F11 step over and into, shift+f11 steps out, shift+f5 stops and
# ctrl+shift+f5 restarts (F5 goes on, F9 is the breakpoint).
[[binding]]
keys = "f10"
action = "debug_step_over"

[[binding]]
keys = "f11"
action = "debug_step_into"

[[binding]]
keys = "shift+f11"
action = "debug_step_out"

[[binding]]
keys = "shift+f5"
action = "debug_stop"

[[binding]]
keys = "ctrl+shift+f5"
action = "debug_restart"

# The Debug pane (the stack and the variables of the program, in the bottom bar): shows it and
# gives it the keyboard; with the keyboard in it, hides it
[[binding]]
keys = "ctrl+k v"
action = "show_debug"

[[binding]]
keys = "up"
context = "debug"
action = { debug_pane = "up" }

[[binding]]
keys = "down"
context = "debug"
action = { debug_pane = "down" }

[[binding]]
keys = "pageup"
context = "debug"
action = { debug_pane = "page_up" }

[[binding]]
keys = "pagedown"
context = "debug"
action = { debug_pane = "page_down" }

[[binding]]
keys = "home"
context = "debug"
action = { debug_pane = "first" }

[[binding]]
keys = "end"
context = "debug"
action = { debug_pane = "last" }

[[binding]]
keys = "enter"
context = "debug"
action = { debug_pane = "open" }

[[binding]]
keys = "right"
context = "debug"
action = { debug_pane = "expand" }

[[binding]]
keys = "left"
context = "debug"
action = { debug_pane = "collapse" }

[[binding]]
keys = "tab"
context = "debug"
action = { debug_pane = "switch" }

[[binding]]
keys = "esc"
context = "debug"
action = { debug_pane = "leave" }

# With the keyboard in the Debug pane the program is stepped with plain keys
[[binding]]
keys = "c"
context = "debug"
action = "debug_continue"

[[binding]]
keys = "n"
context = "debug"
action = "debug_step_over"

[[binding]]
keys = "i"
context = "debug"
action = "debug_step_into"

[[binding]]
keys = "o"
context = "debug"
action = "debug_step_out"

[[binding]]
keys = "x"
context = "debug"
action = "debug_stop"

# Set a breakpoint on the line of the cursor, or take it away (a click on the last column of the
# gutter does the same)
[[binding]]
keys = "f9"
context = "editor"
action = "toggle_breakpoint"

# Choose which run configuration F5 starts (and run it)
[[binding]]
keys = "ctrl+k r"
action = "choose_run"

# Go to a line (and column) of the open file
[[binding]]
keys = "ctrl+g"
context = "editor"
action = "go_to_line"

# Step through the results of the last project search without opening it again
[[binding]]
keys = "f3"
action = "find_next"

[[binding]]
keys = "shift+f3"
action = "find_previous"

[[binding]]
keys = "f4"
action = "next_search_result"

[[binding]]
keys = "shift+f4"
action = "previous_search_result"

# Step through the diagnostics (errors and warnings) a language server found in the open file
[[binding]]
keys = "f8"
context = "editor"
action = "next_diagnostic"

[[binding]]
keys = "shift+f8"
context = "editor"
action = "previous_diagnostic"

# The whole text of the diagnostics on the cursor line, in a box (any key closes it)
[[binding]]
keys = "f7"
context = "editor"
action = "show_diagnostics"

# What the language server says about the word at the cursor, in a box (any key closes it)
[[binding]]
keys = "f6"
context = "editor"
action = "show_hover"

# Back to where the last jump left, and forward again (go to line, a search or finder hit, a diagnostic, another file, a far click)
[[binding]]
keys = "alt+,"
action = "jump_back"

[[binding]]
keys = "alt+."
action = "jump_forward"

# Where the word at the cursor is defined (ctrl+click on a word does the same)
[[binding]]
keys = "f12"
context = "editor"
action = "go_to_definition"

# Renames the symbol at the cursor everywhere it is used, through the language server
[[binding]]
keys = "f2"
context = "editor"
action = "rename_symbol"

# What the language server offers to do at the cursor: quick fixes, refactorings
[[binding]]
keys = "ctrl+."
context = "editor"
action = "code_actions"

# Formats the open document with its language server, without saving it
[[binding]]
keys = "alt+shift+f"
context = "editor"
action = "format_document"

# A plugin's pane has the keyboard: esc goes back to the editor. (While the
# pane shows a line to type into, esc first ends the typing.)
[[binding]]
keys = "esc"
action = "focus_editor"
context = "plugin"
