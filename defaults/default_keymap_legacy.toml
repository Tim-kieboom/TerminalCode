# Extra bindings used only when the terminal does not support the kitty
# keyboard protocol. Legacy terminals send some chords as other keys.

# ctrl+backspace arrives as ctrl+h (byte 0x08).
[[binding]]
keys = "ctrl+h"
action = "delete_word_backward"
context = "editor"

# ctrl+] arrives as ctrl+5 (byte 0x1d), and ctrl+[ is the escape key itself, so it cannot
# be told apart; alt+] and alt+\ do the same two things, next to each other on the keyboard.
[[binding]]
keys = "ctrl+5"
action = "indent_line"
context = "editor"

[[binding]]
keys = "alt+]"
action = "indent_line"
context = "editor"

[[binding]]
keys = "alt+\\"
action = "outdent_line"
context = "editor"

# ctrl+/ arrives as byte 0x1f, which is ctrl+7 (and ctrl+_ on the same key).
[[binding]]
keys = "ctrl+7"
action = "toggle_comment"
context = "editor"

# ctrl+. arrives as a plain `.`, so code actions have alt+enter too.
[[binding]]
keys = "alt+enter"
action = "code_actions"
context = "editor"
