# Default theme. Each table is a style slot.
#
# [background]  (optional; reserved name, not a slot)
#   color   = "#1e1e2e"   a color, or "transparent"/"reset" to paint nothing
#   opacity = 0.8         0 (nothing painted) .. 1 (the color as is); below 1 the
#                         color needs to be hex
#   blend   = "terminal"  what opacity below 1 does:
#                         "terminal" (default): mix the color with the terminal's own
#                           background and paint that. The cells are SOLID, so the
#                           terminal's blur and see-through do not show in them.
#                         "none": paint the exact color and let the terminal make that
#                           color translucent (kitty 0.39+: put
#                           `transparent_background_colors #1e1e2e@0.3` in kitty.conf;
#                           the editor prints the exact line at startup).
#
# To see your terminal's blur and opacity through the editor, paint no background:
# leave out [background] or write color = "transparent". Terminals only make their
# default background translucent, never a color the program paints. A text program
# cannot blur anything itself; it can only choose cell colors.
#
# Slots: each table is a style with these keys, all optional:
#   text       = "red"          color of the characters
#   background = "#1e1e2e"      color behind the characters
#   modifiers  = ["bold"]
#   underline  = "red"          color of the line under the characters, for slots that
#                               style an underline (a language server's diagnostics);
#                               it shows where a terminal supports colored underlines
# (`fg` and `bg` are still accepted for `text` and `background`.) The reserved
# [background] table above is the screen's background, not a slot.
#
# Colors: names such as "red" or "dark_gray", hex such as "#1e1e2e", or "@name" for an
# entry of [palette] below.
# Modifiers: bold, dim, italic, underlined, reversed, crossed_out.
# Prefer explicit `text` and `background` over `reversed`: reversed swaps the colors
# of whatever is underneath, so `text` would end up as the block color.

[background]
# color = "transparent"
color = "#1f1f1f"

# Named colors. A slot (or [background]) writes "@name" to use one, so a color is
# written once and a theme is restyled by changing its entries; a slot can still
# write a literal color to differ from its role. Entries are plain colors and
# cannot refer to each other.
[palette]
# UI roles
text        = "#b9b9bd"   # ordinary text
dim         = "#8a8fa7"   # secondary text (inactive tabs)
muted       = "dark_gray" # hints, borders, directories
faint       = "#2f2c37"   # line numbers, tree guides
surface     = "#171725"   # status and find bars
accent      = "#7f0e3f"   # the focused pane's border
accent_bg   = "#560e31"   # active tab and selected row
accent_text = "#e0abdc"   # the current line number
on_accent   = "#cbb7c1"   # text drawn on accent_bg
selection   = "#45162e"   # selected text
info        = "cyan"
error       = "red"
warning     = "yellow"    # search matches
# Syntax hues
red         = "#f44747"
orange      = "#ce9178"   # strings
yellow      = "#dcdcaa"   # functions
green       = "#b5cea8"   # numbers
teal        = "#4ec9b0"   # types
cyan        = "#9cdcfe"   # properties, parameters
blue        = "#569cd6"   # keywords
purple      = "#c586c0"   # control-flow keywords
pink        = "#d16969"
gold        = "#d7ba7d"   # escapes
comment     = "#6a9955"
punctuation = "#d4d4d4"   # operators and punctuation

["pane.border"]
text = "@muted"

["pane.title"]
modifiers = ["bold"]

["list.selected"]
modifiers = ["reversed"]

["editor.line_number"]
text = "@faint"

["editor.line_number.current"]
text = "@accent_text"

["editor.selection"]
background = "@selection"

["status.bar"]
text = "@text"
background = "@surface"

["pane.border.focused"]
text = "@accent"

["tab.bar"]

["tab.active"]
text = "@on_accent"
background = "@accent_bg"
modifiers = ["bold"]

["tab.inactive"]
text = "@dim"

["tab.overflow"]
text = "@dim"

["tab.add"]
text = "@green"
modifiers = ["bold"]

["notification.info"]
text = "@info"

["notification.more"]
text = "@dim"

["notification.error"]
text = "@error"
modifiers = ["bold"]

["explorer.dir"]
text = "@muted"
modifiers = ["bold"]

["explorer.file"]
text = "@text"

["explorer.ignored"]
text = "@muted"
modifiers = ["dim"]

["explorer.active"]
text = "@accent_text"
modifiers = ["bold"]

["explorer.drop"]
text = "@on_accent"
background = "@accent"
modifiers = ["bold"]

["explorer.selected"]
background = "@accent_bg"

["explorer.selected.inactive"]
background = "@selection"

["cursor.unfocused"]
background = "@selection"

["explorer.hint"]
text = "@muted"

["explorer.guide"]
text = "@faint"

["completion.selected"]
background = "@accent_bg"

["completion.detail"]
text = "@muted"

["completion.kind"]
text = "@accent_text"

["completion.docs"]
text = "@dim"

["hover.text"]
text = "@text"

["search.match"]
text = "@warning"
modifiers = ["bold"]

["editor.match"]
text = "black"
background = "@warning"

# Language server diagnostics: `text` colors the gutter mark and the message in the
# status bar, `underline` the line under the text they are about.
["editor.diagnostic.error"]
text = "@error"
underline = "@error"

["editor.diagnostic.warning"]
text = "@warning"
underline = "@warning"

["editor.diagnostic.info"]
text = "@info"
underline = "@info"

["editor.diagnostic.hint"]
text = "@dim"
underline = "@dim"

["finder.match"]
text = "@accent_text"
modifiers = ["bold"]

["find.bar"]
text = "@text"
background = "@surface"

["find.hint"]
text = "@muted"
background = "@surface"

# Syntax highlighting. A highlight capture such as `function.macro` uses the most
# specific of `syntax.function.macro`, `syntax.function` and `syntax` that exists
# here; a capture with none of them is not colored.
["syntax.keyword"]
text = "@blue"

["syntax.keyword.control"]
text = "@purple"

["syntax.variable"]
text = "@cyan"

["syntax.namespace"]
text = "@teal"

["syntax.function"]
text = "@yellow"

["syntax.function.macro"]
text = "@yellow"

["syntax.type"]
text = "@teal"

["syntax.constructor"]
text = "@teal"

["syntax.string"]
text = "@orange"

["syntax.escape"]
text = "@gold"

["syntax.constant"]
text = "@blue"

["syntax.comment"]
text = "@comment"

["syntax.operator"]
text = "@punctuation"

["syntax.punctuation"]
text = "@punctuation"

["syntax.property"]
text = "@cyan"

["syntax.attribute"]
text = "@teal"

["syntax.label"]
text = "@blue"

["syntax.variable.parameter"]
text = "@cyan"

["syntax.variable.builtin"]
text = "@blue"

["syntax.number"]
text = "@green"

["syntax.float"]
text = "@green"

["syntax.boolean"]
text = "@blue"

["syntax.character"]
text = "@orange"

["syntax.string.escape"]
text = "@gold"

["syntax.string.special.key"]
text = "@cyan"

["syntax.text.title"]
text = "@blue"
modifiers = ["bold"]

["syntax.text.literal"]
text = "@orange"

["syntax.text.uri"]
text = "@blue"
modifiers = ["underlined"]

["syntax.text.reference"]
text = "@blue"

["syntax.text.strong"]
modifiers = ["bold"]

["syntax.text.emphasis"]
modifiers = ["italic"]
