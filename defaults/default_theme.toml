# Default theme. Each table is a style slot.
# Colors: names such as "red" or "dark_gray", or hex such as "#1e1e2e".
# Modifiers: bold, dim, italic, underlined, reversed, crossed_out.

["pane.border"]
fg = "dark_gray"

["pane.title"]
modifiers = ["bold"]

["list.selected"]
modifiers = ["reversed"]

["editor.line_number"]
fg = "dark_gray"

["editor.line_number.current"]
fg = "white"

["editor.selection"]
bg = "blue"

["status.bar"]
modifiers = ["reversed"]

["pane.border.focused"]
fg = "cyan"

["tab.bar"]
fg = "gray"

["tab.active"]
modifiers = ["bold", "reversed"]

["tab.inactive"]
fg = "gray"
