# Default theme. Each table is a style slot.
#
# [background]  (optional; reserved name, not a slot)
#   color   = "#1e1e2e"   a color, or "transparent"/"reset" to paint nothing
#   opacity = 0.8         0 (nothing painted) .. 1 (the color as is); below 1 the
#                         color needs to be hex
#   blend   = "terminal"  what opacity below 1 does:
#                         "terminal" (default): mix the color with the terminal's own
#                           background and paint that. The cells are SOLID, so the
#                           terminal's blur and see-through do not show in them.
#                         "none": paint the exact color and let the terminal make that
#                           color translucent (kitty 0.39+: put
#                           `transparent_background_colors #1e1e2e@0.3` in kitty.conf;
#                           the editor prints the exact line at startup).
#
# To see your terminal's blur and opacity through the editor, paint no background:
# leave out [background] or write color = "transparent". Terminals only make their
# default background translucent, never a color the program paints. A text program
# cannot blur anything itself; it can only choose cell colors.
#
# Slots: each table is a style with these keys, all optional:
#   text       = "red"          color of the characters
#   background = "#1e1e2e"      color behind the characters
#   modifiers  = ["bold"]
# (`fg` and `bg` are still accepted for `text` and `background`.) The reserved
# [background] table above is the screen's background, not a slot.
#
# Colors: names such as "red" or "dark_gray", or hex such as "#1e1e2e".
# Modifiers: bold, dim, italic, underlined, reversed, crossed_out.
# Prefer explicit `text` and `background` over `reversed`: reversed swaps the colors
# of whatever is underneath, so `text` would end up as the block color.

[background]
color = "transparent"

["pane.border"]
text = "dark_gray"

["pane.title"]
modifiers = ["bold"]

["list.selected"]
modifiers = ["reversed"]

["editor.line_number"]
text = "#2f2c37"

["editor.line_number.current"]
text = "#e0abdc"

["editor.selection"]
background = "#45162e"

["status.bar"]
text = "#b9b9bd"
background = "#171725"

["pane.border.focused"]
text = "cyan"

["tab.bar"]

["tab.active"]
text = "#cbb7c1"
background = "#560e31"
modifiers = ["bold"]

["tab.inactive"]
text = "#8a8fa7"

["notification.info"]
text = "cyan"

["notification.error"]
text = "red"
modifiers = ["bold"]

["explorer.dir"]
text = "dark_gray"
modifiers = ["bold"]

["explorer.file"]
text = "#b9b9bd"

["explorer.selected"]
background = "#560e31"

["explorer.selected.inactive"]
background = "#560e31"
modifiers = ["bold"]

["explorer.hint"]
text = "dark_gray"

["explorer.guide"]
text = "#2f2c37"

["search.match"]
text = "yellow"
modifiers = ["bold"]

["editor.match"]
text = "black"
background = "yellow"

["find.bar"]
text = "#b9b9bd"
background = "#171725"

["find.hint"]
text = "dark_gray"
background = "#171725"

# Syntax highlighting. A highlight capture such as `function.macro` uses the most
# specific of `syntax.function.macro`, `syntax.function` and `syntax` that exists
# here; a capture with none of them is not colored.
["syntax.keyword"]
text = "#cba6f7"

["syntax.function"]
text = "#89b4fa"

["syntax.function.macro"]
text = "#94e2d5"

["syntax.type"]
text = "#f9e2af"

["syntax.constructor"]
text = "#f9e2af"

["syntax.string"]
text = "#a6e3a1"

["syntax.escape"]
text = "#fab387"

["syntax.constant"]
text = "#fab387"

["syntax.comment"]
text = "#6c7086"
modifiers = ["italic"]

["syntax.operator"]
text = "#89dceb"

["syntax.punctuation"]
text = "#9399b2"

["syntax.property"]
text = "#eba0ac"

["syntax.attribute"]
text = "#f9e2af"

["syntax.label"]
text = "#fab387"

["syntax.variable.parameter"]
text = "#eba0ac"
modifiers = ["italic"]

["syntax.variable.builtin"]
text = "#f38ba8"
