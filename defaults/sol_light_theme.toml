# SolLight: built-in theme with the Sol colors for the interface. The syntax colors and the
# slots are those of light_theme.toml (see there for the format).

[background]
color = "#f6f4ec"

[palette]
# UI roles
text        = "#2e3040"   # ordinary text
dim         = "#5c6078"   # secondary text (inactive tabs)
muted       = "#8a8ea6"   # hints, borders, directories
faint       = "#c9cbd8"   # line numbers, tree guides
surface     = "#ebe8dc"   # status and find bars
accent      = "#8f8730"   # the focused pane's border
accent_bg   = "#e4e6c4"   # active tab and selected row
accent_text = "#5f6a14"   # the current line number
on_accent   = "#3a3f10"   # text drawn on accent_bg
selection   = "#dcdff0"   # selected text
info        = "#4a5a8f"
error       = "#b83a55"
warning     = "#c9a820"   # search matches
# Syntax hues
red         = "#cd3131"
orange      = "#a31515"   # strings
yellow      = "#795e26"   # functions
green       = "#098658"   # numbers
teal        = "#267f99"   # types
cyan        = "#001080"   # properties, parameters
blue        = "#0000ff"   # keywords
purple      = "#af00db"   # control-flow keywords
pink        = "#c2185b"
gold        = "#ee0000"   # escapes
comment     = "#008000"
punctuation = "#1e1e28"   # operators and punctuation

["pane.border"]
text = "@muted"

["pane.title"]
modifiers = ["bold"]

["list.selected"]
modifiers = ["reversed"]

["editor.line_number"]
text = "@faint"

["editor.line_number.current"]
text = "@accent_text"

["editor.selection"]
background = "@selection"

["status.bar"]
text = "@text"
background = "@surface"

["pane.border.focused"]
text = "@accent"

["tab.bar"]

["tab.active"]
text = "@on_accent"
background = "@accent_bg"
modifiers = ["bold"]

["tab.inactive"]
text = "@dim"

["bar.tab.active"]
text = "@on_accent"
background = "@accent_bg"
modifiers = ["bold"]

["bar.tab.inactive"]
text = "@dim"

["tab.overflow"]
text = "@dim"

["tab.add"]
text = "@green"
modifiers = ["bold"]

["notification.info"]
text = "@info"

["notification.more"]
text = "@dim"

["notification.error"]
text = "@error"
modifiers = ["bold"]

["explorer.dir"]
text = "@muted"
modifiers = ["bold"]

["explorer.file"]
text = "@text"

["explorer.ignored"]
text = "@muted"
modifiers = ["dim"]

["explorer.active"]
text = "@accent_text"
modifiers = ["bold"]

["explorer.drop"]
text = "@on_accent"
background = "@accent"
modifiers = ["bold"]

["explorer.selected"]
background = "@accent_bg"

["explorer.selected.inactive"]
background = "@selection"

["cursor.unfocused"]
background = "@selection"

["cursor.extra"]
text = "@surface"
background = "@text"

["explorer.hint"]
text = "@muted"

["explorer.guide"]
text = "@faint"

["completion.selected"]
background = "@accent_bg"

["completion.detail"]
text = "@muted"

["completion.kind"]
text = "@accent_text"

["completion.docs"]
text = "@dim"

["hover.text"]
text = "@text"

["search.match"]
text = "@warning"
modifiers = ["bold"]

["editor.match"]
text = "black"
background = "@warning"

# Language server diagnostics: `text` colors the gutter mark and the message in the
# status bar, `underline` the line under the text they are about.
["editor.diagnostic.error"]
text = "@error"
underline = "@error"

["editor.diagnostic.warning"]
text = "@warning"
underline = "@warning"

["editor.diagnostic.info"]
text = "@info"
underline = "@info"

["editor.diagnostic.hint"]
text = "@dim"
underline = "@dim"

["finder.match"]
text = "@accent_text"
modifiers = ["bold"]

["find.bar"]
text = "@text"
background = "@surface"

["find.hint"]
text = "@muted"
background = "@surface"

# Syntax highlighting. A highlight capture such as `function.macro` uses the most
# specific of `syntax.function.macro`, `syntax.function` and `syntax` that exists
# here; a capture with none of them is not colored.
["syntax.keyword"]
text = "@blue"

["syntax.keyword.control"]
text = "@purple"

["syntax.variable"]
text = "@cyan"

["syntax.namespace"]
text = "@teal"

["syntax.function"]
text = "@yellow"

["syntax.function.macro"]
text = "@yellow"

["syntax.type"]
text = "@teal"

["syntax.constructor"]
text = "@teal"

["syntax.string"]
text = "@orange"

["syntax.escape"]
text = "@gold"

["syntax.constant"]
text = "@blue"

["syntax.comment"]
text = "@comment"

["syntax.operator"]
text = "@punctuation"

["syntax.punctuation"]
text = "@punctuation"

["syntax.property"]
text = "@cyan"

["syntax.attribute"]
text = "@teal"

["syntax.label"]
text = "@blue"

["syntax.variable.parameter"]
text = "@cyan"

["syntax.variable.builtin"]
text = "@blue"

["syntax.number"]
text = "@green"

["syntax.float"]
text = "@green"

["syntax.boolean"]
text = "@blue"

["syntax.character"]
text = "@orange"

["syntax.string.escape"]
text = "@gold"

["syntax.string.special.key"]
text = "@cyan"

["syntax.text.title"]
text = "@blue"
modifiers = ["bold"]

["syntax.text.literal"]
text = "@orange"

["syntax.text.uri"]
text = "@blue"
modifiers = ["underlined"]

["syntax.text.reference"]
text = "@blue"

["syntax.text.strong"]
modifiers = ["bold"]

["syntax.text.emphasis"]
modifiers = ["italic"]
